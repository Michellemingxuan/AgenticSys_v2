<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Assist Copilot — Workflow (React Flow) · v3</title>
  <link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css">
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
    body { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, Helvetica, sans-serif; background: #FFFFFF; color: #2D2D2D; }
    #root { background: #FFFFFF; }

    .doc-hdr { position: fixed; top: 14px; left: 24px; z-index: 5; pointer-events: none; max-width: 70vw; }
    .doc-hdr h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: #2D2D2D; }
    .doc-hdr .sub { font-size: 12.5px; color: #7A7569; margin-top: 5px; line-height: 1.4; }
    .doc-hdr .sub b { color: #4A3B69; }

    /* ── question / answer pill ── */
    .endpoint { width: 200px; height: 56px; border-radius: 28px; background: #DCE7F4; border: 1.4px solid #3D6BA8; display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; color: #1F3A5F; box-shadow: 0 1.5px 4px rgba(0,0,0,0.14); padding: 0 16px; }
    .endpoint svg { width: 18px; height: 18px; stroke: #3D6BA8; fill: none; flex-shrink: 0; }
    .endpoint .label { font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; color: #4F6B8C; text-transform: uppercase; }
    .endpoint .text { line-height: 1.25; }

    /* ── compact agent card ── */
    .card { background: #FFFFFF; border: 1px solid #BFD3E8; border-radius: 10px; box-shadow: 0 1.5px 5px rgba(0,0,0,0.10); display: flex; align-items: stretch; overflow: hidden; }
    .card .left { flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px 16px; min-width: 0; }
    .icon-box { width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; background: #E5EDF6; display: flex; align-items: center; justify-content: center; }
    .icon-box svg { width: 20px; height: 20px; stroke: #3D6BA8; fill: none; }
    .card .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .card .name { font-size: 13px; font-weight: 700; color: #1F3A5F; line-height: 1.2; }
    .card .action { font-size: 11px; color: #5C5044; line-height: 1.3; }
    .card.memory { border-color: #C3B6D8; box-shadow: 0 1.5px 5px rgba(122,90,168,0.16); }
    .card.memory .icon-box { background: #EDE9F3; }
    .card.memory .icon-box svg { stroke: #7A5AA8; }
    .card.memory .name { color: #4A3B69; }

    /* ── DYNAMIC TEAM frame ── */
    .team-frame { background: #F4F8FD; border: 1.5px solid #3D6BA8; border-radius: 12px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(61,107,168,0.12); }
    .team-frame .head { font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; color: #3D6BA8; text-transform: uppercase; text-align: center; }
    .team-frame .head-sub { font-size: 9.5px; color: #7A9BC1; font-style: italic; text-align: center; margin-top: 2px; }
    .team-frame .specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .team-frame .spec { background: #FFFFFF; border: 1px solid #BFD3E8; border-radius: 8px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .team-frame .spec .ico { width: 32px; height: 32px; border-radius: 6px; background: #E5EDF6; display: flex; align-items: center; justify-content: center; }
    .team-frame .spec .ico svg { width: 18px; height: 18px; stroke: #3D6BA8; fill: none; }
    .team-frame .spec .name { font-size: 11px; font-weight: 700; color: #1F3A5F; text-align: center; line-height: 1.15; }
    .team-frame .spec .distiller { margin-top: 3px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 9px; background: #EDE9F3; border: 1px solid #C3B6D8; font-size: 8px; font-weight: 700; letter-spacing: 0.4px; color: #4A3B69; text-transform: uppercase; }
    .team-frame .spec .distiller svg { width: 10px; height: 10px; stroke: #7A5AA8; fill: none; flex-shrink: 0; }
    .team-frame .spec.more { background: #FAFCFE; border: 1px dashed #BFD3E8; }
    .team-frame .spec.more .ico { background: transparent; }
    .team-frame .spec.more .ico .dots { font-size: 22px; font-weight: 700; color: #7A9BC1; letter-spacing: 1.5px; line-height: 1; }
    .team-frame .spec.more .name { color: #7A9BC1; font-style: italic; font-weight: 500; }
    .team-frame .distiller-note { margin-top: 10px; text-align: center; font-size: 9px; color: #7A5AA8; font-style: italic; }
    .team-frame .distiller-note b { color: #4A3B69; font-style: normal; }
    .team-frame .review-arrow { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #BFD3E8; text-align: center; font-size: 9.5px; color: #4F6B8C; font-style: italic; }
    .team-frame .gs { background: #FFFFFF; border: 1px solid #BFD3E8; border-radius: 8px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .team-frame .gs .ico { width: 32px; height: 32px; border-radius: 6px; background: #E5EDF6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .team-frame .gs .ico svg { width: 19px; height: 19px; stroke: #3D6BA8; fill: none; }
    .team-frame .gs .text { flex: 1; display: flex; flex-direction: column; gap: 1px; }
    .team-frame .gs .name { font-size: 12px; font-weight: 700; color: #1F3A5F; }
    .team-frame .gs .action { font-size: 9.5px; color: #5C5044; font-style: italic; }

    /* ── KB section label ── */
    .kb-label { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #7A5AA8; }

    /* ── Knowledge Base object (the store) ── */
    .kb-obj { background: #F6F3FA; border: 1.5px solid #B49AD6; border-radius: 14px; padding: 16px 18px; box-shadow: 0 3px 14px rgba(122,90,168,0.16); }
    .kb-obj .o-head { font-size: 14px; font-weight: 700; color: #4A3B69; display: flex; gap: 8px; align-items: center; line-height: 1.2; }
    .kb-obj .o-head svg { width: 20px; height: 20px; stroke: #7A5AA8; fill: none; flex-shrink: 0; }
    .kb-obj .o-sub { font-size: 10px; color: #8A7BA6; font-style: italic; margin-top: 4px; }
    .kb-obj .o-chips { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .kb-obj .o-chip { font-size: 12px; font-weight: 700; color: #4A3B69; background: #FFFFFF; border: 1px solid #C3B6D8; border-radius: 9px; padding: 9px 12px; }
    .kb-obj .o-chip span { color: #8A7BA6; font-weight: 400; font-size: 10px; }
    .kb-obj .o-levels { display: flex; gap: 8px; margin-top: 12px; }
    .kb-obj .o-lvl { font-size: 10px; font-weight: 600; color: #4A3B69; background: #EDE9F3; border: 1px solid #C3B6D8; border-radius: 10px; padding: 5px 11px; }

    /* ── memory agent (Knowledge Manager / Knowledge-to-Model) ── */
    .mem-agent { background: #FFFFFF; border: 1px solid #C3B6D8; border-radius: 11px; box-shadow: 0 2px 8px rgba(122,90,168,0.16); overflow: hidden; }
    .mem-agent .ma-hd { background: #7A5AA8; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
    .mem-agent .ma-hd svg { width: 18px; height: 18px; stroke: #FFFFFF; fill: none; flex-shrink: 0; }
    .mem-agent .ma-hd .star { color: #FFDE8A; font-size: 16px; }
    .mem-agent .ma-body { padding: 11px 16px 13px; }
    .mem-agent .ma-desc { font-size: 11px; color: #6C6459; line-height: 1.4; }
    .mem-agent.star { border: 2px solid #7A5AA8; box-shadow: 0 4px 16px rgba(122,90,168,0.26); }
    .mem-agent .ma-prod { font-size: 10.5px; font-weight: 600; color: #7A5AA8; font-style: italic; margin-top: 9px; }

    /* ── Repo panel (skills / tools) · categorized ── */
    .repo { background: #FBFAF7; border: 1px solid #D9CFC0; border-radius: 12px; padding: 13px 15px; box-shadow: 0 1.5px 6px rgba(0,0,0,0.07); }
    .repo .r-head { font-size: 12px; font-weight: 700; color: #5C5044; display: flex; align-items: center; gap: 8px; }
    .repo .r-head svg { width: 17px; height: 17px; stroke: #A8875A; fill: none; }
    .repo .r-sub { font-size: 9px; color: #9A9387; font-style: italic; margin-top: 3px; }
    .repo .r-cat { margin-top: 10px; }
    .repo .r-cat-l { font-size: 8px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; color: #A8875A; margin-bottom: 5px; }
    .repo .r-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .repo .r-chip { font-size: 9.5px; color: #5C5044; background: #F4F0E6; border: 1px solid #D4C5A9; border-radius: 10px; padding: 3px 9px; white-space: nowrap; }
    .repo .r-dots { font-size: 13px; font-weight: 700; color: #A8875A; align-self: center; padding: 0 4px; letter-spacing: 1px; }
    .repo .r-more { font-size: 9px; color: #A8875A; font-style: italic; margin-top: 10px; }

    /* ── backdrop behind the whole orchestrator-led team (very light, translucent so arrows show through) ── */
    .backdrop { width: 100%; height: 100%; border-radius: 16px; background: rgba(214,226,243,0.15); border: 1px solid rgba(190,206,228,0.45); box-shadow: 0 4px 10px rgba(61,107,168,0.09); }

    /* ── tiny edge tag (labels above/below the memory arrow) ── */
    .edge-tag { font-size: 9px; font-weight: 700; font-style: italic; color: #7A5AA8; background: rgba(255,255,255,0.9); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }

    /* ── vertical spec agent (like a team Spec Agent) · lightning = inspiration/opportunity ── */
    .spec-agent { background: #FFFFFF; border: 1.5px solid #C3B6D8; border-radius: 12px; padding: 13px 16px; display: flex; flex-direction: column; align-items: center; gap: 7px; box-shadow: 0 2px 9px rgba(122,90,168,0.18); }
    .spec-agent .sa-ico { position: relative; width: 46px; height: 46px; border-radius: 11px; background: #7A5AA8; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(122,90,168,0.42); }
    .spec-agent .sa-ico svg { width: 25px; height: 25px; stroke: #FFFFFF; fill: none; }
    .spec-agent .sa-spark { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: #F5B301; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 5px rgba(0,0,0,0.28); }
    .spec-agent .sa-spark svg { width: 12px; height: 12px; stroke: #FFFFFF; fill: #FFFFFF; }
    .spec-agent .sa-name { font-size: 12.5px; font-weight: 700; color: #4A3B69; text-align: center; line-height: 1.2; }
    .spec-agent .sa-sub { font-size: 9px; color: #8A7BA6; font-style: italic; text-align: center; }
    .spec-agent .sa-capline { font-size: 9px; font-weight: 600; color: #7A5AA8; text-align: center; line-height: 1.5; margin-top: 3px; }

    .react-flow__handle { width: 8px; height: 8px; background: #3D6BA8; border: 1.5px solid #FFFFFF; opacity: 1; }
    .react-flow__handle.hmem { background: #7A5AA8; }
    .react-flow__edge.animated path { stroke-dasharray: 5 4; animation: rf-flow 1.0s linear infinite; }
    @keyframes rf-flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
    .react-flow__edge-text { font-size: 10.5px; font-style: italic; fill: #1F3A5F; }
    .react-flow__edge-textbg { fill: #FFFFFF; }
    .react-flow__attribution { display: none; }
  </style>
</head>
<body>
  <div class="doc-hdr">
    <h1>Case Assist Copilot — Workflow</h1>
    <div class="sub">Ask → answer in one journey, and every case quietly <b>compounds into cross-case memory</b> that grows better models over time.</div>
  </div>
  <div id="root"></div>

  <script type="module">
    import React from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
    import ReactFlow, {
      Background, Controls, Handle, Position, MarkerType
    } from 'https://esm.sh/reactflow@11.11.4?deps=react@18.3.1,react-dom@18.3.1';
    import { html } from 'https://esm.sh/htm@3.1.1/react?deps=react@18.3.1';

    const Ic = {
      qmark:   html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      sparkle: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>`,
      chat:    html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
      target:  html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
      files:   html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="16" rx="2"/><path d="M7 2h10a2 2 0 0 1 2 2v14"/><line x1="6" y1="11" x2="14" y2="11"/><line x1="6" y1="14" x2="14" y2="14"/><line x1="6" y1="17" x2="11" y2="17"/></svg>`,
      scale:   html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M3 7c2 0 4-1 6-2 2 1 4 2 6 2s4-1 6-2"/><path d="M7 14a3 3 0 1 0-6 0c0 1 .5 2 1.5 2.5l1.5.5 1.5-.5C6.5 16 7 15 7 14z"/><path d="M23 14a3 3 0 1 0-6 0c0 1 .5 2 1.5 2.5l1.5.5 1.5-.5c1-.5 1.5-1.5 1.5-2.5z"/></svg>`,
      database:html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
      zap:     html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
      brain:   html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24A2.5 2.5 0 0 0 14.5 2Z"/></svg>`,
      cube:    html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>`,
      layers:  html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
      cycle:   html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
      book:    html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
      wrench:  html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4z"/></svg>`,
      person:  html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      pBureau:   html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9v12"/><path d="M15 9v12"/></svg>`,
      pModel:    html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      pCapacity: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
    };

    const QuestionNode = ({ data }) => html`
      <div className="endpoint" style=${{ width: data.width || 200 }}>
        ${Ic.qmark}
        <div className="text"><div className="label">question</div><div>${data.text}</div></div>
        <${Handle} type="source" position=${Position.Right}/>
      </div>`;

    const AnswerNode = ({ data }) => html`
      <div className="endpoint" style=${{ width: data.width || 200 }}>
        <${Handle} type="target" position=${Position.Right}/>
        ${Ic.sparkle}
        <div className="text"><div className="label">answer</div><div>${data.text}</div></div>
      </div>`;

    const CardNode = ({ data }) => {
      const targetPos = data.targetLeft ? Position.Left : Position.Top;
      const sourcePos = data.sourceLeft ? Position.Left : Position.Bottom;
      return html`
        <div className=${'card' + (data.variant ? ' ' + data.variant : '')} style=${{ width: data.width || 280 }}>
          ${data.targets
            ? data.targets.map(t => html`<${Handle} key=${t.id} id=${t.id} type="target" position=${t.position}/>`)
            : html`<${Handle} type="target" position=${targetPos}/>`}
          <div className="left">
            <div className="icon-box">${Ic[data.icon]}</div>
            <div className="text">
              <div className="name">${data.name}</div>
              ${data.action && html`<div className="action">${data.action}</div>`}
            </div>
          </div>
          ${data.handles
            ? data.handles.map((id, i) => html`<${Handle} key=${id} id=${id} type="source" position=${Position.Bottom} style=${{ left: `${(100*(i+1))/(data.handles.length+1)}%` }}/>`)
            : html`<${Handle} type="source" position=${sourcePos}/>`}
        </div>`;
    };

    const Spec = ({ icon, name }) => html`
      <div className="spec">
        <div className="ico">${Ic[icon]}</div>
        <div className="name">${name}</div>
        <div className="distiller">${Ic.zap}<span>Distiller</span></div>
      </div>`;

    const TeamFrameNode = ({ data }) => html`
      <div className="team-frame" style=${{ width: data.width || 360 }}>
        <${Handle} type="target" position=${Position.Top}/>
        <div className="head">Dynamic Team — recruited per question</div>
        <div className="head-sub">× N specialists picked by team_construction</div>
        <div className="specs">
          <${Spec} icon="pBureau"   name="Bureau Spec Agent"/>
          <${Spec} icon="pModel"    name="Modeling Spec Agent"/>
          <${Spec} icon="pCapacity" name="Spend Spec Agent"/>
          <div className="spec more"><div className="ico"><span className="dots">···</span></div><div className="name">more</div></div>
        </div>
        <div className="distiller-note">each specialist <b>binds a fire-and-forget Distiller</b> ⚡ → writes memory async, off the answer path</div>
        <div className="review-arrow">↓ outputs reviewed by</div>
        <div className="gs">
          <div className="ico">${Ic.scale}</div>
          <div className="text"><div className="name">General Spec Agent</div><div className="action">cross-domain review</div></div>
        </div>
        <${Handle} id="out" type="source" position=${Position.Bottom}/>
      </div>`;

    const BackdropNode = ({ data }) => html`
      <div className="backdrop" style=${{ width: data.width, height: data.height }}>
        <${Handle} id="kb" type="target" position=${Position.Left} className="react-flow__handle hmem" style=${{ top: '50%' }}/>
      </div>`;

    const TagNode = ({ data }) => html`<div className="edge-tag">${data.text}</div>`;

    const SpecAgentNode = ({ data }) => html`
      <div className="spec-agent" style=${{ width: data.width || 180 }}>
        <${Handle} type="target" position=${Position.Top} className="react-flow__handle hmem"/>
        <div className="sa-ico">
          ${Ic[data.icon]}
          ${data.spark && html`<span className="sa-spark">${Ic.zap}</span>`}
        </div>
        <div className="sa-name">${data.name}</div>
        ${data.sub && html`<div className="sa-sub">${data.sub}</div>`}
        ${data.caps && html`<div className="sa-capline">${data.caps.join('  |  ')}</div>`}
        <${Handle} type="source" position=${Position.Bottom} className="react-flow__handle hmem"/>
      </div>`;

    // Knowledge Base — the store object (middle)
    const KbObjectNode = ({ data }) => html`
      <div className="kb-obj" style=${{ width: data.width || 280 }}>
        <${Handle} id="fromMgr" type="target" position=${Position.Top} className="react-flow__handle hmem"/>
        <${Handle} id="loop" type="source" position=${Position.Right} className="react-flow__handle hmem" style=${{ top: '74%' }}/>
        <div className="o-head">${Ic.brain}<span>Knowledge Base & Memory System</span></div>
        <div className="o-sub">the shared memory object · persists across cases</div>
        <div className="o-chips">
          <div className="o-chip">📄 Reports <span>· raw source material</span></div>
          <div className="o-chip">📚 Memory Wiki <span>· atomic facts, cross-linked</span></div>
        </div>
        <${Handle} id="toK2M" type="source" position=${Position.Bottom} className="react-flow__handle hmem"/>
      </div>`;

    // Knowledge Manager / Knowledge-to-Model Specialist
    const MemAgentNode = ({ data }) => html`
      <div className=${'mem-agent' + (data.star ? ' star' : '')} style=${{ width: data.width || 260 }}>
        ${data.tIn && html`<${Handle} id="in" type="target" position=${Position.Top} className="react-flow__handle hmem"/>`}
        <div className="ma-hd">${data.star ? html`<span className="star">★</span>` : Ic.person}<span>${data.name}</span></div>
        <div className="ma-body">
          <div className="ma-desc">${data.desc}</div>
          ${data.produces && html`<div className="ma-prod">${data.produces}</div>`}
        </div>
        ${data.sOut && html`<${Handle} id="out" type="source" position=${Position.Bottom} className="react-flow__handle hmem"/>`}
      </div>`;

    const RepoNode = ({ data }) => html`
      <div className="repo" style=${{ width: data.width || 280 }}>
        <div className="r-head">${Ic[data.icon]}<span>${data.name}</span></div>
        <div className="r-sub">${data.sub}</div>
        ${data.cats.map(c => html`
          <div key=${c.l} className="r-cat">
            <div className="r-cat-l">${c.l}</div>
            <div className="r-chips">${c.chips.map(ch => ch === '…'
              ? html`<span key=${c.l + '-d'} className="r-dots">…</span>`
              : html`<span key=${ch} className="r-chip">${ch}</span>`)}</div>
          </div>`)}
        <div className="r-more">${data.more}</div>
      </div>`;

    const nodeTypes = {
      question: QuestionNode, answer: AnswerNode, card: CardNode,
      teamFrame: TeamFrameNode, kbObject: KbObjectNode, memAgent: MemAgentNode, repo: RepoNode, backdrop: BackdropNode, specAgent: SpecAgentNode, tag: TagNode,
    };

    // ─────────────────────────────────────────────────────────────
    //  NODES
    // ─────────────────────────────────────────────────────────────
    const initialNodes = [
      // backdrop behind the whole orchestrator-led team (Orchestrator · Report · Dynamic Team · DataPull)
      // ← adjust width / height / position here to resize the shadow box
      { id: 'team-bg', type: 'backdrop', position: { x: 452, y: 168 }, data: { width: 930, height: 520 },
        draggable: false, selectable: false, connectable: false },

      // labels straddling the shadow's middle line (y≈428): store just above, context insertion just below
      { id: 'tag-store', type: 'tag', position: { x: 392, y: 410 }, data: { text: 'store' },
        draggable: false, selectable: false, zIndex: 30 },
      { id: 'tag-ctx', type: 'tag', position: { x: 356, y: 440 }, data: { text: 'context insertion' },
        draggable: false, selectable: false, zIndex: 30 },


      { id: 'question', type: 'question', position: { x: 470, y: 96 },
        data: { text: '"Is default risk elevated?"', width: 190 }},

      { id: 'chat-in', type: 'card', position: { x: 770, y: 92 }, data: {
        icon: 'chat', name: 'Chat Agent', action: 'Screen the question', width: 280, targetLeft: true }},

      { id: 'orch-decide', type: 'card', position: { x: 770, y: 182 }, data: {
        icon: 'target', name: 'Orchestrator', action: 'Decide how to answer', width: 280,
        handles: ['p1', 'p2', 'p3'],
        targets: [ { id: 't-top', position: Position.Top } ] }},

      { id: 'reportagent', type: 'card', position: { x: 470, y: 322 }, data: {
        icon: 'files', name: 'Report Agent', action: 'Answer from case reports', width: 180 }},

      { id: 'team', type: 'teamFrame', position: { x: 660, y: 300 }, data: { width: 500 }},

      { id: 'pullsignal', type: 'card', position: { x: 1180, y: 322 }, data: {
        icon: 'database', name: 'DataPull Agent', action: 'Fetch missing data', width: 180 }},

      { id: 'orch-synth', type: 'card', position: { x: 770, y: 690 }, data: {
        icon: 'target', name: 'Orchestrator', action: 'Synthesize the answer', width: 280,
        targets: [ { id: 't-left', position: Position.Left }, { id: 't-top', position: Position.Top }, { id: 't-right', position: Position.Right } ] }},

      { id: 'chat-out', type: 'card', position: { x: 810, y: 776 }, data: {
        icon: 'chat', name: 'Chat Agent', action: 'Conversational reply', width: 200, sourceLeft: true }},

      { id: 'answer', type: 'answer', position: { x: 480, y: 782 },
        data: { text: 'returned to reviewer', width: 200 }},

      // ── Cross-case KB & Memory · vertical stack, LEFT of the orchestrator team ──
      { id: 'kb-title', type: 'card', position: { x: 40, y: 336 }, data: {
        icon: 'person', name: 'Knowledge Manager Agent', action: 'finds commons & uniques across cases; keeps memory searchable',
        width: 300, variant: 'memory' }},

      { id: 'kb-obj', type: 'kbObject', position: { x: 30, y: 452 }, data: { width: 320 }},

      { id: 'kb-k2m', type: 'specAgent', position: { x: 70, y: 642 }, data: {
        icon: 'cube', name: 'Knowledge-to-Model Spec Agent', spark: true, width: 250,
        sub: 'spots opportunities to improve models',
        caps: ['feature discovery', 'model failure analysis', 'validation & testing'] }},

      { id: 'kb-models', type: 'card', position: { x: 70, y: 848 }, data: {
        icon: 'layers', name: 'Model Assets', action: 'engineered features · candidate models · eval sets',
        width: 250, variant: 'memory' }},

      // ── Skills & Tools repositories · by category (a deep, developed arsenal) ──
      { id: 'skills', type: 'repo', position: { x: 1440, y: 96 }, data: {
        icon: 'book', name: 'Skills Repository', sub: 'prompt modes injected into agents at LLM-call time', width: 360,
        cats: [
          { l: 'workflow/', chips: ['team_construction', 'synthesis', 'comparison', 'report_check', 'section_planning', 'data_query', 'data_analysis', 'report_generation', 'redact', 'relevance_check', 'data_catalog', '…'] },
          { l: 'domain/', chips: ['bureau', 'modeling', 'spend_payments', 'crossbu', 'wcc', 'customer_rel', 'capacity_afford', '…'] },
          { l: 'report/', chips: ['report_request', 'report_needle', 'report_analysis', '…'] },
          { l: 'data/', chips: ['data_maintenance', 'catalog_sync', '…'] },
          { l: 'helper/', chips: ['acropedia', '…'] },
        ],
        more: 'one base agent, many skills — swap the lens, not the code' }},

      { id: 'tools', type: 'repo', position: { x: 1440, y: 620 }, data: {
        icon: 'wrench', name: 'Tools Repository', sub: 'the functions agents call to query, shape & render data', width: 360,
        cats: [
          { l: 'data_query', chips: ['query_table', 'filter', 'aggregate', 'summarize_trend', 'summarize_by_group', 'join', 'get_table_schema', '…'] },
          { l: 'data_viz', chips: ['make_chart', 'auto_chart', 'render', '…'] },
          { l: 'search & memory', chips: ['fs_grep', 'report_needle', 'kb_search', '…'] },
        ],
        more: 'a comprehensive, growing arsenal — new weapons added as the mission grows' }},
    ];

    // ─────────────────────────────────────────────────────────────
    //  EDGES
    // ─────────────────────────────────────────────────────────────
    const blue = '#3D6BA8';
    const purple = '#7A5AA8';
    const arrow = { type: MarkerType.ArrowClosed, color: blue, width: 14, height: 14 };
    const arrowP = { type: MarkerType.ArrowClosed, color: purple, width: 13, height: 13 };
    const flow  = { type: 'default',    animated: true, style: { stroke: blue, strokeWidth: 2.2 }, markerEnd: arrow };
    const flowS = { type: 'smoothstep', animated: true, style: { stroke: blue, strokeWidth: 2.2 }, markerEnd: arrow, pathOptions: { borderRadius: 18 } };
    const memLbl = { labelStyle: { fill: '#4A3B69', fontSize: 10, fontStyle: 'italic', fontWeight: 700 }, labelBgStyle: { fill: '#FFFFFF' }, labelBgPadding: [5, 2], labelBgBorderRadius: 4 };
    const mem  = { type: 'default',    animated: true, style: { stroke: purple, strokeWidth: 1.9, strokeDasharray: '6 4' }, markerEnd: arrowP, ...memLbl };
    // one narrow double-headed connector — KB ⇄ the orchestrator-led team
    const memThin = { type: 'default', animated: true, style: { stroke: purple, strokeWidth: 2, strokeDasharray: '6 4' }, markerEnd: arrowP, markerStart: arrowP };

    const initialEdges = [
      { id: 'q-chat',    source: 'question', target: 'chat-in',     ...flow },
      { id: 'chat-orch', source: 'chat-in',  target: 'orch-decide', targetHandle: 't-top', ...flow },

      { id: 'orch-p1', source: 'orch-decide', sourceHandle: 'p1', target: 'reportagent', ...flow },
      { id: 'orch-p2', source: 'orch-decide', sourceHandle: 'p2', target: 'team',        ...flow },
      { id: 'orch-p3', source: 'orch-decide', sourceHandle: 'p3', target: 'pullsignal',  ...flow },

      { id: 'p1-synth', source: 'reportagent', target: 'orch-synth', targetHandle: 't-left',  ...flowS },
      { id: 'p2-synth', source: 'team', sourceHandle: 'out', target: 'orch-synth', targetHandle: 't-top', ...flow },
      { id: 'p3-synth', source: 'pullsignal',  target: 'orch-synth', targetHandle: 't-right', ...flowS },

      { id: 'synth-chat', source: 'orch-synth', target: 'chat-out', ...flow },
      { id: 'chat-ans',   source: 'chat-out',   target: 'answer',   ...flow },

      // vertical KB chain: manager → object → specialist → assets
      { id: 'mgr-obj',  source: 'kb-title', target: 'kb-obj', targetHandle: 'fromMgr', ...mem, label: 'compact · index' },
      { id: 'obj-k2m',  source: 'kb-obj', sourceHandle: 'toK2M', target: 'kb-k2m', ...mem },
      { id: 'k2m-models', source: 'kb-k2m', target: 'kb-models', ...mem, label: 'opportunities' },

      // KB ⇄ the orchestrator-led team: one double-headed arrow (labels sit above/below it)
      { id: 'kb-team', source: 'kb-obj', sourceHandle: 'loop', target: 'team-bg', targetHandle: 'kb', ...memThin, zIndex: 20 },
    ];

    function App() {
      return html`
        <${ReactFlow}
          defaultNodes=${initialNodes}
          defaultEdges=${initialEdges}
          nodeTypes=${nodeTypes}
          fitView
          fitViewOptions=${{ padding: 0.12 }}
          minZoom=${0.2}
          maxZoom=${2.5}
          proOptions=${{ hideAttribution: true }}
        >
          <${Background} color="#E5E0D2" gap=${24} size=${1}/>
          <${Controls} showInteractive=${false}/>
        </${ReactFlow}>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
