# Pillar-wide vocabulary. Injected into orchestrator + every specialist.
# Treats values as REFERENCE only — always verify via `get_table_schema`
# / `query_table` what this case actually carries before filtering.
concept_glossary: |
  ═══ CREDIT-RISK CONCEPT VOCABULARY (reference; verify against data) ═══

  ── CUSTOMER CONTEXT ──
  This is the COMMERCIAL / SBS credit-&-risk pillar: the customer under review
  is a MERCHANT (a business), using merchant / business cards (the 'SBS'
  card_portfolio; `card_name` often contains "BUSINESS"). So "the customer" IS a
  merchant — merchant-level model scores describe this customer directly (see the
  CDSS note under Scores below).

  Consumer vs commercial cards — `crossbu_cards.card_portfolio`:
    'CPS' ≈ consumer (personal/individual/retail). 'SBS' ≈ commercial
    (business/SMB). Other codes may exist; probe before filtering.
    Secondary signal: `card_name` containing "BUSINESS" → commercial.

  Balance vs spend vs payment (different concepts, different tables):
    balance / outstanding / exposure → `crossbu_cards.balance` (crossbu).
    spend / charged / transaction volume → `spends_data.Amount` (spend_payments).
    payment amount → `payments.Payment Amount` (spend_payments).

  Do NOT compare spend volume to payment volume to infer repayment adequacy,
    "unpaid balances", or liquidity risk — in ANY window. Spend is continuous
    and payment is lumpy and LAGS the billing cycle (this month's charges are
    paid next cycle), and the two are pulled over different windows, so a
    spend-vs-payment magnitude ratio ("spend is ~Nx payment", "spend outpaced
    payments") is a timing artifact, NOT a solvency signal. Here total payment
    (~$4.8M) actually EXCEEDS total spend (~$3.9M) and the monthly ratio is
    ~1.1x — a "4x spend > payment" claim is a fabrication that contradicts the
    data. Any spend-vs-payment figure MUST be arithmetic on same-window tool
    numbers; never assert spend outpaces payment when the numbers show
    otherwise, and never let a "distressed case" prior override them.
    Repayment adequacy → the model ratio `cust_expsr_avg_rem_12m_ratio`
    (modeling); unpaid balance / outstanding → `crossbu_cards.balance` (crossbu).

  Payment success / return — the real column is `Return Flag` (aliases:
    `payment_status`, `return_flag`). It is an INTEGER code, NOT a string:
    0 = payment succeeded (cleared), 1 = payment returned (failed). Filter on the
    code — `Return Flag == 0` for successful payments, `Return Flag == 1` for
    returned — NOT the strings 'success' / 'return' (those do NOT exist in the
    real data). Confirm via `get_table_schema('payments')`: its declared_values
    show 0 / 1.

  Scores: bureau (`bureau_data`, owned by `bureau`) vs internal model
    (`modelling_data`, owned by `modeling`). Independent — don't conflate.
    "The model" / "the models" / "model" in reviewer questions ALWAYS
    refers to these INTERNAL ML risk-scoring models — not the agent
    system, not a process, not a generic abstraction. Subject "the model"
    → route to `modeling`.
    Internal model scores are ML outputs (risk scores). The two headline scores
    — AUTHORITATIVE column mapping, use these names everywhere:
      • CDSS (Credit Decision Support System) — the CUSTOMER's CDSS is the
        `credit_loss_prob` column. When a question says "CDSS", this is it.
      • TSR (Total Structural Risk) — `tot_struct_risk_score` column.
      • `cust_eff_se_cdss_5_180_day_score` is a MERCHANT CDSS, NOT the customer's
        — the merchant's adjusted CDSS risk, aggregated over 5–180 days from the
        CDSS scores of all spending at that merchant. Because the customer here
        IS a merchant (see CUSTOMER CONTEXT), it is this customer's own risk
        viewed AS a merchant; as a 5–180-day merchant aggregate it does NOT
        change within a day. Only cite it for merchant-side risk.
    Other internal scores may also be present (cbr_score, gam_*_risk_score,
    etc.) — probe `modelling_data` schema to see what's in this case.
    Score drivers — `score_drivers_data` — list the variables most
    contributing to each ML score per `trans_month`. Columns
    `top_<score>{1..5}` push the score up; `bottom_<score>{1..5}` push it
    down. So `top_cdss*` / `bottom_cdss*` are the CDSS feature drivers;
    `top_tsr*` / `bottom_tsr*` are the TSR drivers. New score families
    will appear as new `top_<score>*` / `bottom_<score>*` columns.

  Account status / delinquency — `crossbu_cards.account_status`:
    'Current' = good standing. DPB buckets ('30 DPB', '60 DPB', '90 DPB',
    '120 DPB') = past-due (Days Past Billing). Other strings may exist.
    THE DEFAULT DATE: when `demographics_data` carries a `Default Date`
    column, THAT is the answer — quote it verbatim and stop, even though it
    is a recorded attribute that may fall outside every series and past the
    case cut-off. When it is ABSENT, do not derive one: show the reviewer the
    `crossbu_cards` rows (month, card, status, balance, write-off) and say no
    default date is recorded. Which statuses constitute a default is policy
    the data does not carry, so it is the reviewer's call, not the system's.
    Owned by `crossbu`.

  Ramp-up period — DYNAMIC, NOT a fixed-length window:
    The phase when an activity / volume / intensity metric rises from a low
    baseline to a higher steady level. Examples: monthly spend climbing
    from ~$X to ~$Y over several months and then plateauing; balance growing
    until it stabilizes; payment volume building up. There is NO default
    "ramp-up window" length; identify it FROM THE DATA.

    Identification recipe (apply per the activity in question):
      1. Pull the relevant time series — typically `spends_data.Amount`
         aggregated by month (spends is transaction-level) for spend ramp-up;
         `crossbu_cards.balance` over `Month` for exposure ramp-up;
         `payments.Payment Amount` over `payment_date` for payment ramp-up.
      2. Find the rise: where the metric starts increasing meaningfully
         above its early baseline.
      3. Find the plateau: where the metric stops rising and stabilizes
         (or where the rise visibly ends — a peak, then flat or a turn).
      4. Report the start and end as observed dates from the series.
    "Start of ramp-up" = the rise begins. "End of ramp-up" = the metric
    has reached its higher steady level (or its peak before any decline).

  Rule: when observed values disagree with this glossary, trust the data.

