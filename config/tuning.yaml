# ─────────────────────────────────────────────────────────────────────────────
# Memory / context tuning knobs.
#
# Edit a value and restart `python server.py` — that's it. These are read at
# process start, so a restart is required for changes to take effect.
#
# Precedence: an inline env var or a .env entry STILL OVERRIDES the value here
# (e.g. `EPISODIC_TURNS=2 python server.py` wins over episodic_turns below), so
# you can do one-off tests without editing this file. This file is the
# persistent default.
# ─────────────────────────────────────────────────────────────────────────────

memory:
  # Recent turns shown to the orchestrator verbatim (episodic coreference).
  # The durable Amem case summary is injected as condensed "older context" only
  # once a case runs past this many turns.  [env: EPISODIC_TURNS]
  episodic_turns: 10

  # How often the Amem case summary is (re)built — every N turns, not every turn.
  # The recent-episodic window covers the gap between refreshes.
  # [env: AMEM_CONSOLIDATE_EVERY_N]
  consolidate_every_n_turns: 10

  # K1 — compact trigger. specialist_kps ACCUMULATES KPs in RAM across turns;
  # once it grows past this many, we pay ONE Amem hybrid search to compact it
  # down to active_kp_keep (K2) most-relevant KPs, then it accumulates again.
  # So this is the ceiling, not a per-turn cap. e.g. 5 → compact once >5 KPs.
  # [env: AMEM_ACTIVE_KP_THRESHOLD]
  active_kp_threshold: 200

  # K2 — compact target (should be << K1). How many most-relevant KPs to keep
  # after a compaction. The gap (K1 - K2) is the hysteresis: bigger gap → the
  # ~3s search fires less often. e.g. K1=5, K2=2 → compact 6→2, accumulate to
  # 6 again. In production ~ K1=100, K2=20.  [env: AMEM_ACTIVE_KP_KEEP]
  active_kp_keep: 20


# ─────────────────────────────────────────────────────────────────────────────
# Timeouts (seconds). Every value is a CEILING, not a target — raising one buys
# patience for a slow backend, it does not make anything faster.
#
# They nest: turn_wall_clock is the outermost fence, and the phases inside it
# (screen → orch_plan → specialist → report_agent) must each fit within it or
# the fence fires first and the inner limit never gets a chance to produce its
# clearer error message. Keep the sum of a realistic path comfortably under it.
#
# The project's performance targets (screen rejection < 5s, single-specialist
# answer <= 20s) are TARGETS; these are the failure thresholds around them.
# ─────────────────────────────────────────────────────────────────────────────

timeouts:
  # Outermost per-turn fence. A turn exceeding this is cancelled outright and
  # the user gets a "turn exceeded" error. Must exceed the slowest realistic
  # path (screen + planning + slowest specialist + review + report).
  # [env: TURN_WALL_CLOCK_S]
  turn_wall_clock_s: 360

  # How long a NEW question waits for the previous turn on the same case to
  # release `turn_lock` before erroring out. Bounds the "frozen browser"
  # symptom when a prior turn hangs.  [env: QUEUED_TURN_MAX_WAIT_S]
  queued_turn_max_wait_s: 90

  # Screen phase (redact + relevance_check). Target is < 5s; this catches a
  # hung LLM before the user sits on a silent spinner.  [env: SCREEN_TIMEOUT_S]
  screen_s: 30

  # Stall fence inside the screen budget: abandon a wedged attempt at 10s and
  # re-issue once, sharing the 30s above rather than adding to it. The phase's
  # own target is <5s, so a healthy screen never trips it. `safechain_call_s` /
  # `safechain_stall_retry_s` cannot cover this phase — 40s is larger than the
  # whole 30s budget, so the phase fence fires first. 0 disables the retry.
  # [env: SCREEN_STALL_RETRY_S]
  screen_stall_retry_s: 10

  # Round-1 team-planning watchdog ONLY. Normally ~3s; on a stall the phase is
  # aborted and RETRIED rather than waiting out the per-call cap, and the
  # deadline is disarmed on the final attempt so a merely-slow env still
  # completes. Tight is correct here BECAUSE it retries.
  # [env: ORCH_PLAN_TIMEOUT_S]
  orch_plan_s: 25

  # The coherence reviewer's single LLM call. It used to borrow orch_plan_s,
  # which wants the opposite thing: the reviewer has NO retry, so expiry drops
  # the coherence gate for the turn. At 25s it also sat UNDER the 40s per-call
  # stall fence, making the call-layer retry unreachable — that is what killed
  # `general_specialist` at exactly 25.00s in the private env. 120 holds one
  # worst-case call (40 stall + 60 retry = 100) plus the reviewer's own work.
  # [env: REVIEWER_TIMEOUT_S]
  reviewer_s: 120

  # One specialist's whole agentic run (its tool calls included).
  #
  # NOT lowered alongside the call budget, and the reason is unrelated to
  # stalls: dev runs on OpenAI with no stalls at all, and specialists there
  # legitimately reach 232.7s (modeling) and 214.0s (spend_payments) of real
  # multi-round work. This fence is bounded by HOW MUCH AN AGENT DOES, so
  # cutting it to fit the call budget would kill specialists that are working.
  # [env: SPECIALIST_TIMEOUT_S]
  specialist_s: 240

  # report_agent specifically. Holds its legitimate work (96.9s max over 477
  # dev runs) plus one stalled-then-escaped call (~45s). It does NOT need to
  # hold a ridden-out stall any more — that is the bet in `safechain_call_s`.
  # [env: REPORT_AGENT_TIMEOUT_S]
  report_agent_s: 150

  # Second-pass distiller (KP extraction) per specialist. A timeout here costs
  # BOTH next-turn KP warmth AND this turn's charts — auto-distill is the
  # primary chart path — so it is deliberately generous.
  # DELIBERATELY smaller than one worst-case call (40 + 140 = 180). The
  # distiller is fire-and-forget and what really bounds it is
  # `distiller_drain_s` below, so raising this would change nothing: a retry
  # that ESCAPES the stall finishes in ~45s and fits the drain, and one that
  # rides it out cannot fit in 60s at any setting. Losing that turn's KPs is
  # the designed degradation — the answer is already on screen.
  # [env: DISTILLER_TIMEOUT_S]
  distiller_s: 120

  # End-of-turn drain of the fire-and-forget distiller/auto-chart tasks. The
  # text answer is already on screen; this bounds how long charts may still
  # land. On expiry the turn completes and the un-drained KPs exist in RAM but
  # were never written to Amem.  [env: DISTILLER_DRAIN_TIMEOUT_S]
  distiller_drain_s: 60

  # Per-LLM-call cap on the safechain (prod) backend — the budget for ONE
  # attempt, and paired with `safechain_stall_retry_s` below.
  #
  # 60 BETS THAT THE RETRY ESCAPES. The evidence for that is concurrent
  # divergence: `distiller.bureau` returned in 5.8s while `distiller.modeling`
  # hung 120s in the same pool at the same moment, so the wedge belongs to the
  # REQUEST, not to a bad window — a fresh one should not inherit it. Given
  # that, this only has to cover a healthy call: p99 is 7.5s over 88 dev calls
  # and 2.1-5.6s in prod, so 60 leaves ~8x margin.
  #
  # THE BET IS FALSIFIABLE, and `safechain_retry_stalled` in the log is how.
  # It fires only when the SECOND attempt also times out — i.e. when a retry
  # did NOT escape. If that count stays at zero, this can drop further. If it
  # is non-trivial, the wedge survives re-issue and the budget must go back
  # above the 126-131s plateau so a stalled call can at least ride it out.
  #
  # NOTE an earlier comment here claimed every phase fence should be TIGHTER
  # than this. That is right for SINGLE-CALL phases (screen, orch_plan), and
  # backwards for multi-round agents: a specialist making four calls must be
  # LOOSER than one call's cap or it can never complete more than one slow
  # call.  [env: SAFECHAIN_CALL_TIMEOUT_S]
  safechain_call_s: 60

  # First-attempt fence on a safechain call. A call still running at 40s is not
  # slow, it is WEDGED — measured per-call latency is p99 7.5s (88 dev calls)
  # and 2.1-5.6s in prod, so this is ~5x the observed worst case and cannot
  # abandon a healthy call. On expiry the attempt is dropped and ONE fresh
  # request is issued with the full `safechain_call_s` budget above, which can
  # ride the stall out if it recurs. 0 disables, restoring a single attempt.
  # [env: SAFECHAIN_STALL_RETRY_S]
  safechain_stall_retry_s: 40

  # Amem durable-memory IO. Reads sit in the turn's critical path, so the
  # budget is tight and a miss degrades to "no memory this turn" rather than
  # failing the turn.  [env: AMEM_READ_TIMEOUT_S / AMEM_WRITE_TIMEOUT_S]
  amem_read_s: 1.5
  amem_write_s: 5.0

  # The batched relevance search that compacts the KP cache working set. Fires only
  # at compaction (~every few turns), so it can afford to be generous.
  # [env: AMEM_ACTIVE_LOAD_TIMEOUT_S]
  amem_active_load_s: 6.0


# ─────────────────────────────────────────────────────────────────────────────
# Knowledge base — retrieval of PRIOR CASES that resemble this one
# (`knowledge_base_search`, backed by the internal clustered case-report KB).
#
# NOT the same thing as the knowledge-POINT cache above: KB = other cases,
# KP = this case. See skills/helper/knowledge_base.md.
# ─────────────────────────────────────────────────────────────────────────────

knowledge_base:
  # The master switch.  [env: KNOWLEDGE_BASE_ENABLED]
  #   false → OFF. `knowledge_base_search` answers "not applicable" without
  #           calling anything, and the specialist is told to say exactly that
  #           for the comparison part of the question.
  #   true  → ON. `client` and `json_path` below must both be set; if they
  #           aren't, calls report "unavailable", which is a misconfiguration
  #           you want to SEE rather than a quiet no-op.
  #   unset → AUTO: on when a client and a json_path are configured, off
  #           otherwise. Dev with nothing wired therefore reads as "off",
  #           not as "broken".
  enabled: true

  # The platform's entry point, as `<module-or-file>:<callable>`. Either an
  # importable package or a loose .py handed over by the KB team — the callable
  # is bound by introspection, so no wrapper module is needed.
  #   tests.doubles.knowledge_base_sim:answer_question  ← the dev simulation
  #   /abs/path/kb_answer.py:answer_question     ← a delivered script
  # [env: KNOWLEDGE_BASE_CLIENT]
  client: "tests.doubles.knowledge_base_sim:answer_question"

  # Absolute path to the aggregated cluster file the client retrieves over
  # (…/aggregated_rank_top_common_unique.json). Relative paths resolve against
  # the server's working directory, which is a known outage shape here — use an
  # absolute one.  [env: KNOWLEDGE_BASE_JSON]
  json_path: "/tmp/aggregated.json"

  # Ceiling on one retrieval. A specialist's whole answer targets ~20s, so this
  # cannot be generous: on expiry the call degrades to "unavailable" and the
  # specialist answers from the case's own data.  [env: KNOWLEDGE_BASE_TIMEOUT_S]
  timeout_s: 20

  # How much of the result reaches the specialist's context. A measured real
  # payload is ~15KB raw and ~10KB after these caps. They trim supporting
  # detail only — every matched case_id is returned regardless, so lowering
  # them never hides a similar case. Bullets are taken ROUND-ROBIN across
  # clusters, so a lower max_bullets thins each cluster evenly rather than
  # dropping the lowest-ranked one (which real data shows can be the most
  # on-target). `rationale` gets half of text_chars — it is the KB's
  # commentary on its own selection, the least load-bearing field.
  # [env: KNOWLEDGE_BASE_MAX_CLUSTERS / _MAX_BULLETS / _TEXT_CHARS]
  max_clusters: 5
  max_bullets: 12
  text_chars: 1000

  # The KB's own grounded synthesis — its own budget, because it runs ~2100
  # chars in practice and is the single most useful field. Trimming it to one
  # bullet's length cut it mid-argument.  [env: KNOWLEDGE_BASE_ANSWER_CHARS]
  answer_chars: 1600

  # Turns of this session's conversation passed to the KB, so a follow-up that
  # names no pattern ("any others like that?") still resolves.
  # [env: KNOWLEDGE_BASE_HISTORY_TURNS]
  history_turns: 5

  # Workers in the knowledge base's OWN thread pool — never the shared one, so
  # a wedged retrieval cannot starve the orchestrator (this repo's "stuck at
  # team construction" outage). 1 also serialises access to a client that
  # caches a safechain model and is not known to be thread-safe, and keeps
  # parallel specialists from earning a 429 between them. Raise only if the
  # client is confirmed thread-safe AND the backend is not rate-limiting.
  # [env: KNOWLEDGE_BASE_MAX_CONCURRENCY]
  max_concurrency: 1

  # After a 429, stop calling for this long — NOT a retry, the opposite. A
  # multi-specialist turn is exactly when we would otherwise pile onto a
  # service that just asked for less traffic: one 429 answers for all of
  # them instead of each burning its own timeout to learn the same thing. A
  # successful call clears it immediately. 0 disables.
  # [env: KNOWLEDGE_BASE_RATE_LIMIT_COOLDOWN_S]
  rate_limit_cooldown_s: 60
