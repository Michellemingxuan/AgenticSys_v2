table: score_drivers_transaction
description: 'Transaction-level snapshot of the top-5 and bottom-5 contributing

  variable names for each internal model score — ONE ROW PER TRANSACTION (contrast

  `score_drivers`, which is per month). Use to explain which features drove the CDSS

  and TSR scores FOR A SPECIFIC TRANSACTION or decline; use the monthly

  `score_drivers` for driver-rotation-over-time questions.


  Carries drivers for two ML scores, columns named by family:

  - CDSS — `top_cdss1..5`, `bottom_cdss1..5`. Cell values are feature names from

  `model_scores_transaction` that pushed CDSS up / down on that transaction.

  - TSR — `top_tsr1..5`, `bottom_tsr1..5`. Same pattern for TSR.


  Authorization columns mirror `model_scores_transaction`: `appr_deny_cd`

  (0 = approved, 2 = DECLINED — not 1) and `auto_decline_pos_deny_cd_s1` (decline reason,

  set only on declines). Join to `model_scores_transaction` on `txn_date_time`.

  HIGH-VOLUME — filter the day-grain `trans_dt` by default; use `txn_date_time` only

  for within-day precision.

  '
rows_per_case: 5000
one_row_per_case: false
aliases:
- score_drivers_data_transaction
columns:
  index:
    dtype: int
    description: Row index within the case's transaction export.
    short_description: Row index within the case's transaction export
  grms_cid:
    dtype: int
    description: Customer identifier (GRMS CID).
    short_description: Customer identifier (GRMS CID)
    dtype_pending_review: true
  trans_dt:
    dtype: date
    parse_hint: '%Y-%m-%d'
    description: Transaction date (YYYY-MM-DD). DEFAULT time-range filter key.
    short_description: Transaction date (YYYY-MM-DD). DEFAULT time-range filter key
  txn_date_time:
    dtype: date
    parse_hint: '%Y-%m-%d %H:%M:%S.%f'
    description: Transaction timestamp with time component. Use only when sub-day
      precision is needed. JOIN KEY to model_scores_transaction AND to
      `spends.Timestamp` — filter this column by a spend transaction's Timestamp
      (`eq` matches at second precision) to pull that transaction's drivers
      (top_cdss*/top_tsr*).
  appr_deny_cd:
    dtype: int
    description: 'Authorization decision. OBSERVED CODING in the real export: 0 = approved, 2 = DECLINED (verified on case 366132845011 — all 755 rows with 2 carry a decline reason, all 8,866 with 0 carry none; blank on 18 rows). The value 1 does NOT appear: filtering eq 1 returns zero rows and reads as "no declines". Filter declines with eq 2.'
    categories:
      '0': approved
      '2': declined
  auto_decline_pos_deny_cd_s1:
    dtype: string
    description: Decline-reason code, populated only when appr_deny_cd = 2.
    short_description: Decline-reason code, populated only when appr_deny_cd = 2
  top_cdss1:
    dtype: string
    description: Strongest feature pushing the CDSS score UP for this transaction.
    short_description: rank-1 driver raising CDSS for this transaction (variable name)
  top_cdss2:
    dtype: string
    description: 2nd strongest feature pushing the CDSS score UP for this transaction.
    short_description: rank-2 driver raising CDSS for this transaction (variable name)
  top_cdss3:
    dtype: string
    description: 3rd strongest feature pushing the CDSS score UP for this transaction.
    short_description: rank-3 driver raising CDSS for this transaction (variable name)
  top_cdss4:
    dtype: string
    description: 4th strongest feature pushing the CDSS score UP for this transaction.
    short_description: rank-4 driver raising CDSS for this transaction (variable name)
  top_cdss5:
    dtype: string
    description: 5th strongest feature pushing the CDSS score UP for this transaction.
    short_description: rank-5 driver raising CDSS for this transaction (variable name)
  bottom_cdss1:
    dtype: string
    description: Strongest feature pushing the CDSS score DOWN for this transaction.
