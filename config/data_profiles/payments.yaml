table: payments
description: Payment records — one row per payment attempt per case. Real data lives
  in two CSVs (`payments_success.csv` + `payments_returns.csv`) which the gateway
  rbinds at load time, adding a synthetic `payment_status` column ("success" or "return")
  to disambiguate. Covers 2024-2025 with data cut-off 2025-12.
rows_per_case: 20
one_row_per_case: false
aliases:
- payments_success
- payments_returns
- payments_data
- payments_returns_data
- payments_returns_data_full
columns:
  grms_cid:
    dtype: string
    description: GRMS customer identifier for the account the payment belongs to.
      Numeric 11-digit id (equals the case id in real data, e.g. "11854808010").
      Present only in the full returns extract.
    description_pending: true
    aliases:
    - grms_cid
  payment_status:
    dtype: categorical
    categories:
      '0': 0.88
      '1': 0.12
    description: 'Return flag indicating whether a payment cleared. Matches the real
      `Return Flag` column, which holds the raw integer code: 0 = payment cleared
      (successful), 1 = payment returned (failed). Filter on the code — `Return Flag
      == 0` for successful payments, `Return Flag == 1` for returned ones. NOTE: an
      earlier revision documented synthesized string values (''success''/''return'')
      produced by a dev gateway that rbinds payments_success.csv + payments_returns.csv;
      the real/prod data ships the raw 0/1 flag instead, so filter on 0/1, not the
      string labels.'
    aliases:
    - Return Flag
    - return_flag
  card_number:
    dtype: categorical
    categories:
      '****1234': 0.25
      '****5678': 0.2
      '****9012': 0.15
      '****3456': 0.15
      '****7890': 0.1
      '****2468': 0.1
      '****1357': 0.05
    description: Masked card number the payment was applied to (last 4 digits shown)
    aliases:
    - Card Number
    categories_pending_review: true
    categories_writeback_skipped: pii_suspected
  payment_date:
    dtype: date
    year:
    - 2024
    - 2025
    description: The calendar date when a borrower’s payment was recorded as received.
    aliases:
    - Payment Date
  payment_amount:
    dtype: float
    distribution: normal
    mean: 1800
    std: 2500
    min: 25
    max: 50000
    description: Amount received as payment toward the outstanding credit balance,
      expressed in US dollars.
    aliases:
    - Payment Amount
  payment_bank_account:
    dtype: categorical
    categories:
      bank_account_1: 0.69
      bank_account_2: 0.11
      bank_account_3: 0.1
      bank_account_5: 0.06
      bank_account_4: 0.04
    description: Masked identifier for the bank account used to make the payment;
      original account number is replaced with a non-identifying numeric code for
      security.
    aliases:
    - Payment Bank Account
    categories_pending_review: true
  return_reason:
    dtype: categorical
    categories:
      ? ''
      : 0.88
      Insufficient Funds: 0.06
      Account Closed: 0.02
      Stop Payment: 0.01
      Invalid Account Number: 0.01
      Unauthorized / Disputed: 0.01
      Bank Processing Error: 0.01
    description: Reason provided for a payment reversal, applicable when the payment
      has been flagged as returned.
    aliases:
    - Return Reason
