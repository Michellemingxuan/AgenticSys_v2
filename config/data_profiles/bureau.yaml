table: bureau
description: Credit bureau data — monthly case-level snapshots spanning the ~18-month
  window before the customer defaulted on their business credit card. One row per
  case per month. Each row carries the case-level bureau scores (FICO, SBFE, LN, CSS,
  FSS, Paydex) plus commercial (SBFE), D&B, consumer-trade, and public-record (judgement/lien)
  aggregates for that month.
rows_per_case: 18
one_row_per_case: false
aliases:
- bureau_data
columns:
  month:
    dtype: date
    parse_hint: '%B''%Y'
    description: Monthly snapshot date for this bureau record (e.g. "July'2023").
      One row per case per month across the review window.
    description_pending: false
    aliases:
    - month
    dtype_pending_review: true
  sbfe_score:
    dtype: int
    distribution: normal
    mean: 875
    std: 30
    min: 500
    max: 950
    description: SBFE Score — business credit score predicting financial delinquency
      or failure. Irrelevant when SBFE Commercial Tradelines == 0 (no commercial trade
      history to score). Values below 863 are risky.
    aliases:
    - SBFE Score
    risk_threshold: 863
    risk_direction: below
  sbfe_commercial_delinquent_trades:
    dtype: int
    distribution: poisson
    lambda: 0.4
    min: 0
    max: 20
    description: Total count of external commercial credit lines (cards, loans, etc.)
      on which the customer defaulted.
    aliases:
    - SBFE Commercial Delinquent Trades
    - Delinquent External Trades
  sbfe_commercial_delinquency_amount:
    dtype: float
    distribution: normal
    mean: 2000
    std: 8000
    min: 0
    max: 500000
    description: Total default amount on external commercial credit lines (USD).
    aliases:
    - SBFE Commercial Delinquency Amount (USD)
    - External Delinquency Amount (USD)
  sbfe_commercial_tradelines:
    dtype: int
    distribution: normal
    mean: 12
    std: 6
    min: 0
    max: 50
    description: Overall count of external commercial credit lines linked to the customer.
      If this is 0 for at least 12 months, then Amex is the primary lender.
    aliases:
    - SBFE Commercial Tradelines
    - Total Tradelines
  sbfe_commercial_exposure:
    dtype: float
    distribution: normal
    mean: 45000
    std: 40000
    min: 0
    max: 500000
    description: Total outstanding balance on all external commercial credit lines
      (USD).
    aliases:
    - SBFE Commercial Exposure (USD)
    - Overall External Exposure (USD)
  sbfe_commercial_revolving_balance:
    dtype: float
    distribution: normal
    mean: 15000
    std: 18000
    min: 0
    max: 300000
    description: Total revolving balance on all external commercial credit lines (USD).
    aliases:
    - SBFE Commercial Revolving Balance (USD)
    - Overall External Revolving Balance (USD)
  sbfe_commercial_utilization:
    dtype: float
    distribution: normal
    mean: 35
    std: 20
    min: 0
    max: 150
    description: Average % utilization across all external commercial credit lines.
    aliases:
    - SBFE Commercial Utlization
    - Average External Utlization
  ln_credit_score:
    dtype: int
    distribution: normal
    mean: 710
    std: 50
    min: 300
    max: 900
    description: LexisNexis Credit Score — predicts consumer likelihood of default.
      Values below 681 are risky.
    aliases:
    - LN Credit Score
    risk_threshold: 681
    risk_direction: below
  ln_blended_score:
    dtype: int
    distribution: normal
    mean: 720
    std: 50
    min: 300
    max: 900
    description: LexisNexis Blended Score — combines traditional credit data with
      alternative data. Values below 694 are risky.
    aliases:
    - LN Blended Score
    risk_threshold: 694
    risk_direction: below
  ln_business_value:
    dtype: int
    distribution: normal
    mean: 1500000
    std: 500000
    min: 0
    max: 10000000
    description: LexisNexis Business Value — total tax-assessed value of business
      address (USD). Decrement is a negative sign.
    aliases:
    - LN Business Value (USD)
    dtype_pending_review: true
  fico_score:
    dtype: int
    distribution: normal
    mean: 740
    std: 60
    min: 300
    max: 850
    description: FICO Score — industry-standard credit risk score. Values below 721
      are risky.
    aliases:
    - FICO Score
    risk_threshold: 721
    risk_direction: below
  css_score:
    dtype: int
    distribution: normal
    mean: 78
    std: 15
    min: 1
    max: 100
    description: CSS Score — business credit risk score using commercial trade data
      and financials. Values below 71 are risky.
    aliases:
    - CSS Score
    risk_threshold: 71
    risk_direction: below
  fss_score:
    dtype: int
    distribution: normal
    mean: 60
    std: 15
    min: 1
    max: 100
    description: FSS Score — business financial strength/stability score. Values below
      51 are risky.
    aliases:
    - FSS Score
    risk_threshold: 51
    risk_direction: below
  paydex_score:
    dtype: int
    distribution: normal
    mean: 72
    std: 15
    min: 0
    max: 100
    description: Paydex Score — business payment performance score. Values below 61
      are risky.
    aliases:
    - Paydex Score
    risk_threshold: 61
    risk_direction: below
  dnb_payment_experiences:
    dtype: int
    distribution: poisson
    lambda: 10
    min: 0
    max: 100
    description: D&B Payment Experiences — volume of reported supplier payment observations
      used to gauge the reliability of delinquency signals and assess a business's
      credit stress.
    aliases:
    - D&B Payment Experiences
  dnb_delinquent_payment_experiences:
    dtype: int
    distribution: poisson
    lambda: 1.0
    min: 0
    max: 100
    description: D&B Delinquent Payment Experiences — count of supplier payment observations
      reflecting delinquency; quantifies the frequency and severity of a business's
      payment stress.
    aliases:
    - D&B Delinquent Payment Experiences
  dnb_delinquent_payment_amount:
    dtype: float
    distribution: normal
    mean: 1500
    std: 6000
    min: 0
    max: 500000
    description: D&B Delinquent Payment Amount — aggregate amount associated with
      delinquent supplier payment records (USD); measures the severity of an organization's
      liquidity pressure.
    aliases:
    - D&B Delinquent Payment Amount (USD)
  judgements_org_count:
    dtype: int
    distribution: poisson
    lambda: 0.15
    min: 0
    max: 10
    description: Number of court judgments filed against the organization.
    aliases:
    - Judgements Org Count
  lien_org_count:
    dtype: int
    distribution: poisson
    lambda: 0.2
    min: 0
    max: 10
    description: Number of active liens filed against the organization's assets.
    aliases:
    - Lien Org Count
  judgements_amount:
    dtype: float
    distribution: normal
    mean: 3000
    std: 12000
    min: 0
    max: 1000000
    description: Total monetary value of court judgments filed against the business
      (USD) — unresolved legal debt obligations; indicates the severity of credit
      stress.
    aliases:
    - Judgements Amount (USD)
  liens_amount:
    dtype: float
    distribution: normal
    mean: 4000
    std: 15000
    min: 0
    max: 1000000
    description: Total monetary value of active liens placed on the business's assets
      (USD) — magnitude of creditor claims due to unpaid obligations; signals financial
      strain and elevated credit risk.
    aliases:
    - Liens Amount (USD)
  non_revolving_consumer_trades_count:
    dtype: int
    distribution: normal
    mean: 4
    std: 3
    min: 0
    max: 40
    description: Number of open non-revolving consumer credit accounts (fixed-payment
      obligations) — contributes to ongoing consumer credit burden and stress.
    aliases:
    - Non-Revolving Consumer Trades Count
  revolving_consumer_trades_count:
    dtype: int
    distribution: normal
    mean: 6
    std: 4
    min: 0
    max: 40
    description: Number of open revolving consumer credit accounts (credit cards,
      lines of credit) — access to revolving credit and potential utilization-driven
      credit stress.
    aliases:
    - Revolving Consumer Trades Count
  non_revolving_consumer_trades_amount:
    dtype: float
    distribution: normal
    mean: 20000
    std: 25000
    min: 0
    max: 500000
    description: Total outstanding balance across non-revolving consumer credit accounts
      (USD) — fixed repayment obligations contributing to a consumer's debt burden
      and credit stress.
    aliases:
    - Non-Revolving Consumer Trades Amount (USD)
  revolving_consumer_trades_amount:
    dtype: float
    distribution: normal
    mean: 18000
    std: 22000
    min: 0
    max: 500000
    description: Total outstanding balance across revolving consumer credit accounts
      (credit cards, lines of credit) (USD) — variable debt exposure that can drive
      liquidity pressure and utilization-based credit stress.
    aliases:
    - Revolving Consumer Trades Amount (USD)
  delinquent_consumer_trades_count:
    dtype: int
    distribution: poisson
    lambda: 0.4
    min: 0
    max: 20
    description: Number of consumer credit accounts currently past due or with a recorded
      delinquency — frequency of payment distress and elevated credit stress.
    aliases:
    - Delinquent Consumer Trades Count
  amex_exposure_share:
    dtype: float
    distribution: normal
    mean: 30
    std: 20
    min: 0
    max: 100
    description: Percentage of the customer's Amex exposure relative to overall exposure
      (consumer + commercial + Amex). If Amex Exposure Share is >= 50 for at least
      12 months, then Amex is the primary lender (considered risky).
    aliases:
    - Amex Exposure Share
    risk_threshold: 50
    risk_direction: above
correlations:
- columns:
  - fico_score
  - sbfe_commercial_delinquent_trades
  direction: negative
  strength: 0.7
- columns:
  - fico_score
  - sbfe_commercial_utilization
  direction: negative
  strength: 0.5
- columns:
  - sbfe_score
  - sbfe_commercial_delinquent_trades
  direction: negative
  strength: 0.6
- columns:
  - sbfe_commercial_exposure
  - sbfe_commercial_revolving_balance
  direction: positive
  strength: 0.7
- columns:
  - judgements_org_count
  - lien_org_count
  direction: positive
  strength: 0.5
- columns:
  - judgements_org_count
  - judgements_amount
  direction: positive
  strength: 0.6
- columns:
  - lien_org_count
  - liens_amount
  direction: positive
  strength: 0.6
- columns:
  - dnb_payment_experiences
  - dnb_delinquent_payment_experiences
  direction: positive
  strength: 0.4
- columns:
  - dnb_delinquent_payment_experiences
  - dnb_delinquent_payment_amount
  direction: positive
  strength: 0.6
- columns:
  - revolving_consumer_trades_count
  - revolving_consumer_trades_amount
  direction: positive
  strength: 0.6
- columns:
  - non_revolving_consumer_trades_count
  - non_revolving_consumer_trades_amount
  direction: positive
  strength: 0.6
- columns:
  - ln_credit_score
  - fico_score
  direction: positive
  strength: 0.7
- columns:
  - css_score
  - fss_score
  direction: positive
  strength: 0.6
